[package]
name = "trino-plugin"
version = "0.1.3"
edition = "2021"
description = "Tabularis driver plugin for Trino"
license = "Apache-2.0"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
